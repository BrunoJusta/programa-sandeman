<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiShare - UCP &amp; Sogrape</title>
<meta name="theme-color" content="#F2C12E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --surface: #F6F7F6;
    --text: #1C211F;
    --muted: #56605A;
    --line: #DADDDB;

    /* Cor do programa */
    --wine: #F2C12E;
    --wine-on: #2A2003;
    --accent: #A67C00;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131716; --surface: #1C2120; --text: #E6E9E7; --muted: #A1A9A4; --line: #313836;
      --accent: #F2C12E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131716; --surface: #1C2120; --text: #E6E9E7; --muted: #A1A9A4; --line: #313836;
    --accent: #F2C12E;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem; line-height: 1.5;
  }

  /* ---------- Topo na cor do programa ---------- */
  .hero { position: relative; color: var(--wine-on); isolation: isolate; }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--wine); transform-origin: bottom;
  }
  .hero .meniscus {
    position: absolute; left: 0; right: 0; bottom: -1px;
    width: 100%; height: clamp(1.5rem, 5vw, 3rem);
    display: block; color: var(--bg);
  }
  .hero-inner {
    max-width: 52rem; margin: 0 auto;
    padding: clamp(2rem, 6vw, 3.5rem) 1.25rem clamp(4.5rem, 11vw, 7rem);
  }
  .hero .kicker { margin: 0 0 .5rem; font-weight: 600; font-size: 1.0625rem; opacity: .9; }
  .hero h1 {
    margin: 0;
    font-size: clamp(2.25rem, 8vw, 4.5rem);
    font-weight: 900; letter-spacing: -0.035em; line-height: 1;
    text-wrap: balance; overflow-wrap: anywhere;
  }

  /* ---------- Agenda ---------- */
  main.agenda { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  .agenda h2 { margin: 0 0 .35rem; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  .agenda .sub { margin: 0 0 2rem; color: var(--muted); }

  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute;
    left: calc(6rem + .8rem - 1px); top: 1.1rem; bottom: 1.1rem;
    width: 2px; background: var(--line);
  }
  .slot { display: grid; grid-template-columns: 6rem 1.6rem minmax(0, 1fr); align-items: start; padding: .85rem 0; }
  .slot time {
    font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: 1.5rem; letter-spacing: -0.02em; line-height: 1.2; text-align: right;
  }
  .slot .dot {
    justify-self: center; margin-top: .55rem;
    width: .8rem; height: .8rem; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--accent);
    position: relative; z-index: 1;
  }
  .slot .dot { background: var(--bg); }
  .slot.hl .dot { background: var(--accent); }
  .slot .what { min-width: 0; padding-left: .5rem; overflow-wrap: anywhere; }
  .slot .title { display: block; font-size: 1.125rem; font-weight: 700; line-height: 1.3; margin-top: .2rem; }
  .slot > div:first-child { text-align: right; }
  .slot time { display: block; }
  .slot .until { display: block; text-align: right; color: var(--muted); font-size: .8125rem; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: .1rem; }
  .facts { display: flex; flex-wrap: wrap; gap: .25rem .9rem; margin-top: .3rem; color: var(--muted); font-size: .875rem; }
  .facts span { display: inline-flex; align-items: center; gap: .35rem; }
  .facts svg { width: .95rem; height: .95rem; flex: none; }
  .parts { list-style: none; margin: .55rem 0 0; padding: 0; display: grid; gap: .45rem; }
  .part { font-size: .9375rem; line-height: 1.4; }
  .part .desc { display: block; }
  .part .who { display: block; color: var(--muted); font-size: .875rem; }
  .who-all { display: block; color: var(--muted); font-size: .875rem; margin-top: .45rem; }
  .parts.multi .part { padding-left: .75rem; border-left: 2px solid var(--line); }

  .slot.hl .what {
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    border-radius: 12px; padding: .65rem .95rem .75rem; margin-top: -.45rem;
  }
  .slot.hl .title { margin-top: 0; }

  @media (max-width: 520px) {
    .slot { grid-template-columns: 4.6rem 1.4rem minmax(0, 1fr); }
    .timeline::before { left: calc(4.6rem + .7rem - 1px); }
    .slot time { font-size: 1.25rem; }
  }

  /* Único momento animado: o topo enche-se com a cor do programa ao abrir */
  @media (prefers-reduced-motion: no-preference) {
    .hero::before { animation: pour .9s cubic-bezier(.65,0,.35,1) both; }
    .hero-inner, .hero .meniscus { animation: fade .5s ease .5s both; }
    .slot { animation: up .45s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(.7s + var(--i) * 55ms); }
    @keyframes pour { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="kicker">Programa da visita</p>
    <h1 translate="no">WiShare&nbsp;- UCP &amp;&nbsp;Sogrape</h1>
  </div>
  <svg class="meniscus" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path fill="currentColor" d="M0 60 L0 34 Q720 -18 1440 34 L1440 60 Z"/>
  </svg>
</header>

<main class="agenda">
  <h2>Agenda do dia</h2>
  <p class="sub" id="sub"></p>
  <ol class="timeline" id="timeline"></ol>
</main>

<script>
  /* ================= EDITAR AQUI =================
     hora: início. fim: só quando o horário é um intervalo.
     partes: descrição, duração (min) e responsável; pode haver várias.
     responsavel ao nível do momento: aparece uma vez, depois das partes. */
  const PROGRAMA = [
    {
      "hora": "09:10",
      "titulo": "Sessão de Boas-Vindas",
      "local": "Sala Principal",
      "partes": [
        {
          "descricao": "Sessão de Boas-Vindas e apresentação do programa",
          "duracao": 5,
          "responsavel": "Mariana Leite"
        }
      ]
    },
    {
      "hora": "09:15",
      "titulo": "Apresentação Sogrape",
      "local": "Sala Principal",
      "responsavel": "Sofia Rocha",
      "partes": [
        {
          "descricao": "Apresentação Institucional da Sogrape",
          "duracao": 40
        },
        {
          "descricao": "Portefólio de Vinho do Porto",
          "duracao": 5
        }
      ]
    },
    {
      "hora": "10:00",
      "fim": "10:30",
      "titulo": "Prova de Vinho do Porto",
      "local": "Sala Arcadas",
      "partes": [
        {
          "descricao": "Porto Ferreira Branco Classic + Sandeman Ruby Classic",
          "duracao": 30,
          "responsavel": "Mariana Alves"
        }
      ]
    },
    {
      "hora": "10:30",
      "fim": "10:45",
      "titulo": "Coffee-Break",
      "local": "Bar",
      "partes": [
        {
          "duracao": 15
        }
      ]
    },
    {
      "hora": "10:45",
      "fim": "11:30",
      "titulo": "Visita Caves Ferreira",
      "local": "Caves Ferreira",
      "partes": [
        {
          "descricao": "Walking Tour",
          "duracao": 45,
          "responsavel": "Grape Ideas"
        }
      ]
    },
    {
      "hora": "11:45",
      "titulo": "Dinâmica de Grupo",
      "local": "Sala Principal",
      "partes": [
        {
          "duracao": 60,
          "responsavel": "Sofia Rocha"
        }
      ]
    },
    {
      "hora": "12:45",
      "titulo": "Sessão de Encerramento",
      "local": "Sala Principal",
      "partes": [
        {
          "descricao": "Mensagem final",
          "duracao": 5
        }
      ]
    }
  ];
  /* =============================================== */

  const toMin = h => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
  const pad = n => String(n).padStart(2, "0");
  const fmtM = m => `${pad(Math.floor(m / 60))}h${pad(m % 60)}`;
  const fmt = h => fmtM(toMin(h));
  const total = l => l.partes.reduce((s, p) => s + (p.duracao || 0), 0);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  const ultimo = PROGRAMA.at(-1);
  document.getElementById("sub").textContent =
    `Das ${fmt(PROGRAMA[0].hora)} às ${fmtM(toMin(ultimo.hora) + total(ultimo))}, ${PROGRAMA.length} momentos.`;

  const list = document.getElementById("timeline");
  PROGRAMA.forEach((l, i) => {
    const li = el("li", "slot" + (l.destaque ? " hl" : ""));
    li.style.setProperty("--i", i);

    const tcol = el("div");
    const time = el("time", null, fmt(l.hora)); time.dateTime = l.hora;
    tcol.append(time);
    if (l.fim) tcol.append(el("span", "until", `até ${fmt(l.fim)}`));
    li.append(tcol, el("span", "dot"));
    li.lastChild.setAttribute("aria-hidden", "true");

    const what = el("div", "what");
    what.append(el("span", "title", l.titulo));

    const facts = el("div", "facts");
    if (l.local) { const f = el("span"); f.innerHTML = ICON_PIN; f.append(l.local); facts.append(f); }
    const d = total(l);
    if (d) { const f = el("span"); f.innerHTML = ICON_CLOCK; f.append(`${d}\u00a0min`); facts.append(f); }
    what.append(facts);

    const partes = l.partes.filter(p => p.descricao || p.responsavel);
    if (partes.length) {
      const multi = partes.length > 1;
      const ul = el("ul", "parts" + (multi ? " multi" : ""));
      partes.forEach(p => {
        const pi = el("li", "part");
        if (p.descricao) pi.append(el("span", "desc", multi && p.duracao ? `${p.descricao}, ${p.duracao}\u00a0min` : p.descricao));
        if (p.responsavel) pi.append(el("span", "who", `Com ${p.responsavel}`));
        ul.append(pi);
      });
      what.append(ul);
    }
    if (l.responsavel) what.append(el("span", "who-all", `Com ${l.responsavel}`));
    li.append(what);
    list.append(li);
  });
</script>
</body>
</html>
